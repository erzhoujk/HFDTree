[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hfdtree"
version = "0.1.0"
description = "An independent implementation of Hindsight and Foresight Distillation Tree credit assignment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "J. K. Zhou" }]
keywords = ["llm-agents", "safety", "credit-assignment", "distillation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.1"]
hf = ["torch>=2.1", "transformers>=4.45"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hfdtree = "hfdtree.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hfdtree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
